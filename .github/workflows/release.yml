name: Release

# Build the installable Akagi archive and attach it to a GitHub Release.
#
# Trigger: pushing a version tag (v0.2.3, v1.0.0, …). That is the single source
# of truth for a release — the workflow creates the Release for the tag if it
# does not exist yet, so "push a tag" is the whole ceremony:
#
#     git tag v0.2.3 && git push origin v0.2.3
#
# workflow_dispatch exists so the same build can be re-run by hand (for example
# to re-attach the archive after editing release notes) without cutting a tag.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write   # required to create the Release and upload the asset

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # node_modules is not tracked (see .gitignore) but ships inside the
      # archive — there is no npm step at install time on the target machine.
      # `npm ci` installs exactly the versions pinned in package-lock.json.
      - name: Install pinned dependencies
        run: npm ci

      - name: Run unit suites
        run: npm test

      # Deterministic build: sorted entries, fixed timestamp. The zip is
      # written to the repository root as `kobalab.zip` (the name is
      # load-bearing — Akagi names the bot after the zip stem).
      - name: Build the Akagi archive
        run: python pack_kobalab.py

      - name: Attach the archive to the Release
        uses: softprops/action-gh-release@v2
        with:
          files: kobalab.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
